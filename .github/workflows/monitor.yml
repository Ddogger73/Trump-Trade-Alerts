name: Trump trade monitor

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min (GitHub may delay runs a bit)
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: trade-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Check for new trades
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python monitor.py

      - name: Save seen trades
        if: always()
        run: |
          git config user.name "trade-bot"
          git config user.email "trade-bot@users.noreply.github.com"
          if [ -f seen.json ]; then git add seen.json; fi
          git diff --cached --quiet || (git commit -m "Update seen trades" && git push)

      - name: Upload debug files on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug.*
          if-no-files-found: ignore
